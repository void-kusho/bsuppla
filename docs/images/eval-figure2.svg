<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420">
  <defs>
    <style>
      .axis { stroke: #cbd5e1; stroke-width: 1; }
      .axis-label { font: 500 11px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
      .tick-label { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .bar-pull { fill: #ef4444; }
      .bar-extract { fill: #f59e0b; }
      .bar-scan { fill: #3b82f6; }
      .legend-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .legend-item { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #334155; }
      .title { font: 600 14px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
      .caption { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .grid-line { stroke: #e2e8f0; stroke-width: 0.5; }
      .value-label { font: 500 9px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <!-- Title -->
  <text x="440" y="25" class="title" text-anchor="middle">Figure 2: End-to-End Time Breakdown by Image</text>

  <g transform="translate(100, 40)">
    <!-- Y Axis -->
    <line x1="0" y1="0" x2="0" y2="320" class="axis"/>
    <!-- X Axis -->
    <line x1="0" y1="320" x2="720" y2="320" class="axis"/>

    <!-- Y Grid Lines & Labels (seconds, log scale) -->
    <line x1="0" y1="40" x2="720" y2="40" class="grid-line"/>
    <text x="-10" y="44" class="tick-label" text-anchor="end">20 s</text>
    <line x1="0" y1="80" x2="720" y2="80" class="grid-line"/>
    <text x="-10" y="84" class="tick-label" text-anchor="end">15 s</text>
    <line x1="0" y1="120" x2="720" y2="120" class="grid-line"/>
    <text x="-10" y="124" class="tick-label" text-anchor="end">10 s</text>
    <line x1="0" y1="160" x2="720" y2="160" class="grid-line"/>
    <text x="-10" y="164" class="tick-label" text-anchor="end">5 s</text>
    <line x1="0" y1="200" x2="720" y2="200" class="grid-line"/>
    <text x="-10" y="204" class="tick-label" text-anchor="end">2 s</text>
    <line x1="0" y1="240" x2="720" y2="240" class="grid-line"/>
    <text x="-10" y="244" class="tick-label" text-anchor="end">1 s</text>
    <line x1="0" y1="280" x2="720" y2="280" class="grid-line"/>
    <text x="-10" y="284" class="tick-label" text-anchor="end">500 ms</text>
    <line x1="0" y1="320" x2="720" y2="320" class="grid-line"/>
    <text x="-10" y="324" class="tick-label" text-anchor="end">0</text>

    <!-- Y Axis Label -->
    <text x="-55" y="160" class="axis-label" text-anchor="middle" transform="rotate(-90 -55 160)">Time (seconds, log scale)</text>

    <!-- Stacked Bars (100px wide each, 20px gap) - log scale -->
    <!-- alpine: 1.26s total - pull 1.2s, extract 0.045s, scan 0.018s -->
    <!-- log10: pull=0.079, extract=-1.347, scan=-1.745 -->
    <!-- y = 320 - (log10(val_s) + 2) / 2.3 * 320 (range -2 to 1.3) -->
    <rect x="20" y="48" width="100" height="272" class="bar-pull"/>
    <rect x="20" y="32" width="100" height="16" class="bar-extract"/>
    <rect x="20" y="28" width="100" height="4" class="bar-scan"/>
    <text x="70" y="24" class="value-label" text-anchor="middle">1.26 s</text>

    <!-- debian: 3.05s - pull 2.8s, extract 0.187s, scan 0.062s -->
    <rect x="140" y="38" width="100" height="282" class="bar-pull"/>
    <rect x="140" y="18" width="100" height="20" class="bar-extract"/>
    <rect x="140" y="14" width="100" height="4" class="bar-scan"/>
    <text x="190" y="10" class="value-label" text-anchor="middle">3.05 s</text>

    <!-- ubuntu: 3.38s - pull 3.1s, extract 0.212s, scan 0.071s -->
    <rect x="260" y="34" width="100" height="286" class="bar-pull"/>
    <rect x="260" y="15" width="100" height="19" class="bar-extract"/>
    <rect x="260" y="11" width="100" height="4" class="bar-scan"/>
    <text x="310" y="7" class="value-label" text-anchor="middle">3.38 s</text>

    <!-- node: 20.5s - pull 18.4s, extract 1.84s, scan 0.245s -->
    <rect x="380" y="18" width="100" height="302" class="bar-pull"/>
    <rect x="380" y="0" width="100" height="18" class="bar-extract"/>
    <rect x="380" y="-4" width="100" height="4" class="bar-scan"/>
    <text x="430" y="-8" class="value-label" text-anchor="middle">20.5 s</text>

    <!-- python: 18.1s - pull 16.2s, extract 1.67s, scan 0.221s -->
    <rect x="500" y="22" width="100" height="298" class="bar-pull"/>
    <rect x="500" y="4" width="100" height="18" class="bar-extract"/>
    <rect x="500" y="0" width="100" height="4" class="bar-scan"/>
    <text x="550" y="-4" class="value-label" text-anchor="middle">18.1 s</text>

    <!-- golang: 23.3s - pull 21.1s, extract 2.01s, scan 0.198s -->
    <rect x="620" y="14" width="100" height="306" class="bar-pull"/>
    <rect x="620" y="-4" width="100" height="18" class="bar-extract"/>
    <rect x="620" y="-8" width="100" height="4" class="bar-scan"/>
    <text x="670" y="-12" class="value-label" text-anchor="middle">23.3 s</text>

    <!-- X Axis Labels -->
    <g font-size="11" fill="#334155" text-anchor="middle">
      <text x="70" y="345">alpine:latest</text>
      <text x="190" y="345">debian:slim</text>
      <text x="310" y="345">ubuntu:latest</text>
      <text x="430" y="345">node:20</text>
      <text x="550" y="345">python:3.11</text>
      <text x="670" y="345">golang:1.21</text>
    </g>

    <!-- Image size labels -->
    <g font-size="9" fill="#64748b" text-anchor="middle">
      <text x="70" y="360">5.6 MB • 1L • 3.2K files</text>
      <text x="190" y="360">69 MB • 1L • 14.8K files</text>
      <text x="310" y="360">77 MB • 1L • 18.5K files</text>
      <text x="430" y="360">1.1 GB • 4L • 42.1K files</text>
      <text x="550" y="360">1.0 GB • 4L • 38.3K files</text>
      <text x="670" y="360">1.3 GB • 5L • 27.8K files</text>
    </g>
  </g>

  <!-- Legend -->
  <rect x="640" y="50" width="180" height="70" class="legend-box"/>
  <rect x="650" y="62" width="14" height="14" rx="2" fill="#ef4444"/>
  <text x="670" y="72" class="legend-item">Docker Pull + Save</text>
  <rect x="650" y="80" width="14" height="14" rx="2" fill="#f59e0b"/>
  <text x="670" y="90" class="legend-item">Layer Extraction</text>
  <rect x="650" y="98" width="14" height="14" rx="2" fill="#3b82f6"/>
  <text x="670" y="108" class="legend-item">Scan Phase</text>

  <!-- Caption -->
  <text x="440" y="400" class="caption" text-anchor="middle">End-to-end time dominated by Docker pull/save (network + tar I/O). Scan phase is <1% of total for large images.</text>
</svg>