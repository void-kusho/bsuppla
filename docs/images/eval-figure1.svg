<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480">
  <defs>
    <style>
      .axis { stroke: #cbd5e1; stroke-width: 1; }
      .axis-label { font: 500 11px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
      .tick-label { font: 400 9px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .bar { rx: 2; }
      .bar-perm { fill: #3b82f6; }
      .bar-elf { fill: #a855f7; }
      .bar-cred { fill: #ec4899; }
      .bar-pkg { fill: #f59e0b; }
      .bar-risk { fill: #ef4444; }
      .legend-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .legend-item { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #334155; }
      .title { font: 600 14px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
      .caption { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .grid-line { stroke: #e2e8f0; stroke-width: 0.5; }
      .value-label { font: 500 9px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
      .formula { font: 400 10px 'JetBrains Mono', 'Fira Code', monospace; fill: #ef4444; }
    </style>
  </defs>

  <!-- Title -->
  <text x="440" y="25" class="title" text-anchor="middle">Figure 1: Per-Detector Median Latency (Log Scale)</text>

  <!-- Chart area -->
  <g transform="translate(90, 40)">
    <!-- Y Axis -->
    <line x1="0" y1="0" x2="0" y2="380" class="axis"/>
    <!-- X Axis -->
    <line x1="0" y1="380" x2="780" y2="380" class="axis"/>

    <!-- Y Grid Lines & Labels (log scale: 1ns, 10ns, 100ns, 1µs, 10µs, 100µs, 1ms, 10ms) -->
    <!-- log10(ns): 0, 1, 2, 3, 4, 5, 6, 7 -->
    <!-- Map to Y: 380 - (log10(ns) / 7) * 380 -->
    <line x1="0" y1="380" x2="780" y2="380" class="grid-line"/>
    <text x="-12" y="384" class="tick-label" text-anchor="end">1 ns</text>
    
    <line x1="0" y1="326" x2="780" y2="326" class="grid-line"/>
    <text x="-12" y="330" class="tick-label" text-anchor="end">10 ns</text>
    
    <line x1="0" y1="271" x2="780" y2="271" class="grid-line"/>
    <text x="-12" y="275" class="tick-label" text-anchor="end">100 ns</text>
    
    <line x1="0" y1="217" x2="780" y2="217" class="grid-line"/>
    <text x="-12" y="221" class="tick-label" text-anchor="end">1 µs</text>
    
    <line x1="0" y1="163" x2="780" y2="163" class="grid-line"/>
    <text x="-12" y="167" class="tick-label" text-anchor="end">10 µs</text>
    
    <line x1="0" y1="109" x2="780" y2="109" class="grid-line"/>
    <text x="-12" y="113" class="tick-label" text-anchor="end">100 µs</text>
    
    <line x1="0" y1="54" x2="780" y2="54" class="grid-line"/>
    <text x="-12" y="58" class="tick-label" text-anchor="end">1 ms</text>
    
    <line x1="0" y1="0" x2="780" y2="0" class="grid-line"/>
    <text x="-12" y="4" class="tick-label" text-anchor="end">10 ms</text>

    <!-- Y Axis Label -->
    <text x="-55" y="190" class="axis-label" text-anchor="middle" transform="rotate(-90 -55 190)">Latency (nanoseconds, log₁₀ scale)</text>

    <!-- Log scale function: y = 380 - (log10(latency_ns) / 7) * 380 -->
    <!-- Calculated positions: -->
    <!-- WorldWritable: 5.28ns → log10=0.723 → y=380-39.2=340.8 -->
    <!-- ExecInWritable: 23.4ns → log10=1.369 → y=380-74.3=305.7 -->
    <!-- InsecureShadow: 23.3ns → log10=1.367 → y=305.8 -->
    <!-- HiddenExecutable: 30.5ns → log10=1.484 → y=300.2 -->
    <!-- SuidSgid: 50.6ns → log10=1.704 → y=287.5 -->
    <!-- ApkRepository: 21.5ns → log10=1.332 → y=308.0 -->
    <!-- ApkKey: 22.8ns → log10=1.358 → y=306.4 -->
    <!-- PkgManagerConfig: 23.6ns → log10=1.373 → y=305.5 -->
    <!-- Lockfile: 31.6ns → log10=1.500 → y=298.7 -->
    <!-- RiskyTool: 54.4ns → log10=1.736 → y=285.6 -->
    <!-- CryptoMiner: 56.6ns → log10=1.753 → y=284.5 -->
    <!-- StartupScript: 56.2ns → log10=1.750 → y=284.7 -->
    <!-- AuthorizedKeys: 57.7ns → log10=1.761 → y=283.9 -->
    <!-- CredentialFile: 72.8ns → log10=1.862 → y=277.8 -->
    <!-- PrivateKey: 100.6ns → log10=2.003 → y=270.7 -->
    <!-- ELF Analyzer: 3380ns (3.38µs) → log10=3.529 → y=188.5 -->

    <!-- Bars (width 35, gap 15) - Proper log scale positioning -->
    <g font-size="9" fill="#1e293b" text-anchor="middle">
      <!-- Permission detectors (blue) -->
      <rect x="20" y="341" width="35" height="39" class="bar bar-perm"/>
      <text x="37.5" y="337" class="value-label">5.3 ns</text>
      
      <rect x="70" y="306" width="35" height="74" class="bar bar-perm"/>
      <text x="87.5" y="302" class="value-label">23.4 ns</text>
      
      <rect x="120" y="306" width="35" height="74" class="bar bar-perm"/>
      <text x="137.5" y="302" class="value-label">23.3 ns</text>
      
      <rect x="170" y="300" width="35" height="80" class="bar bar-perm"/>
      <text x="187.5" y="296" class="value-label">30.5 ns</text>
      
      <rect x="220" y="288" width="35" height="92" class="bar bar-perm"/>
      <text x="237.5" y="284" class="value-label">50.6 ns</text>

      <!-- Package Manager detectors (amber) -->
      <rect x="280" y="308" width="35" height="72" class="bar bar-pkg"/>
      <text x="297.5" y="304" class="value-label">21.5 ns</text>
      
      <rect x="330" y="306" width="35" height="74" class="bar bar-pkg"/>
      <text x="347.5" y="302" class="value-label">22.8 ns</text>
      
      <rect x="380" y="305" width="35" height="75" class="bar bar-pkg"/>
      <text x="397.5" y="301" class="value-label">23.6 ns</text>
      
      <rect x="430" y="299" width="35" height="81" class="bar bar-pkg"/>
      <text x="447.5" y="295" class="value-label">31.6 ns</text>

      <!-- Risk detectors (red) -->
      <rect x="480" y="286" width="35" height="94" class="bar bar-risk"/>
      <text x="497.5" y="282" class="value-label">54.4 ns</text>
      
      <rect x="530" y="284" width="35" height="96" class="bar bar-risk"/>
      <text x="547.5" y="280" class="value-label">56.6 ns</text>
      
      <rect x="580" y="285" width="35" height="95" class="bar bar-risk"/>
      <text x="597.5" y="281" class="value-label">56.2 ns</text>

      <!-- Credential detectors (pink) -->
      <rect x="630" y="284" width="35" height="96" class="bar bar-cred"/>
      <text x="647.5" y="280" class="value-label">57.7 ns</text>
      
      <rect x="680" y="278" width="35" height="102" class="bar bar-cred"/>
      <text x="697.5" y="274" class="value-label">72.8 ns</text>
      
      <rect x="730" y="271" width="35" height="109" class="bar bar-cred"/>
      <text x="747.5" y="267" class="value-label">100.6 ns</text>

      <!-- ELF Detector (purple) -->
      <rect x="785" y="189" width="35" height="191" class="bar bar-elf"/>
      <text x="802.5" y="185" class="value-label">3.38 µs</text>
    </g>

    <!-- X Axis Labels (rotated) -->
    <g font-size="8" fill="#475569" text-anchor="start">
      <text x="25" y="395" transform="rotate(-45 25 395)">WorldWritable</text>
      <text x="75" y="395" transform="rotate(-45 75 395)">ExecInWritable</text>
      <text x="125" y="395" transform="rotate(-45 125 395)">InsecureShadow</text>
      <text x="175" y="395" transform="rotate(-45 175 395)">HiddenExec</text>
      <text x="225" y="395" transform="rotate(-45 225 395)">SuidSgid</text>
      <text x="285" y="395" transform="rotate(-45 285 395)">ApkRepository</text>
      <text x="335" y="395" transform="rotate(-45 335 395)">ApkKey</text>
      <text x="385" y="395" transform="rotate(-45 385 395)">PkgMgrConfig</text>
      <text x="435" y="395" transform="rotate(-45 435 395)">Lockfile</text>
      <text x="485" y="395" transform="rotate(-45 485 395)">RiskyTool</text>
      <text x="535" y="395" transform="rotate(-45 535 395)">CryptoMiner</text>
      <text x="585" y="395" transform="rotate(-45 585 395)">StartupScript</text>
      <text x="635" y="395" transform="rotate(-45 635 395)">AuthKeys</text>
      <text x="685" y="395" transform="rotate(-45 685 395)">CredFile</text>
      <text x="735" y="395" transform="rotate(-45 735 395)">PrivateKey</text>
      <text x="790" y="395" transform="rotate(-45 790 395)">ELF Analyzer</text>
    </g>

    <!-- Category Group Labels -->
    <text x="120" y="415" font="500 10px" fill="#3b82f6" text-anchor="middle">Permissions (5 det.)</text>
    <text x="355" y="415" font="500 10px" fill="#f59e0b" text-anchor="middle">Package Managers (4 det.)</text>
    <text x="530" y="415" font="500 10px" fill="#ef4444" text-anchor="middle">Risk Tools (3 det.)</text>
    <text x="680" y="415" font="500 10px" fill="#ec4899" text-anchor="middle">Credentials (3 det.)</text>
    <text x="800" y="415" font="500 10px" fill="#a855f7" text-anchor="middle">ELF (1 det.)</text>
  </g>

  <!-- Formula box -->
  <rect x="600" y="20" width="260" height="70" class="legend-box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="615" y="38" class="formula">Log Scale Formula:</text>
  <text x="615" y="55" class="formula">y = 380 − (log₁₀(latency_ns) / 7) × 380</text>
  <text x="615" y="72" class="formula" style="font-size:9px;">Range: 1 ns (y=380) → 10 ms (y=0)</text>

  <!-- Legend -->
  <rect x="600" y="100" width="260" height="110" class="legend-box"/>
  <rect x="610" y="112" width="14" height="14" rx="2" fill="#3b82f6"/>
  <text x="630" y="122" class="legend-item">Permissions (5–50 ns)</text>
  <rect x="610" y="130" width="14" height="14" rx="2" fill="#f59e0b"/>
  <text x="630" y="140" class="legend-item">Package Managers (20–32 ns)</text>
  <rect x="610" y="148" width="14" height="14" rx="2" fill="#ef4444"/>
  <text x="630" y="158" class="legend-item">Risk Tools (54–57 ns)</text>
  <rect x="610" y="166" width="14" height="14" rx="2" fill="#ec4899"/>
  <text x="630" y="176" class="legend-item">Credentials (58–101 ns)</text>
  <rect x="610" y="184" width="14" height="14" rx="2" fill="#a855f7"/>
  <text x="630" y="194" class="legend-item">ELF Analysis (3.38 µs)</text>

  <!-- Caption -->
  <text x="440" y="460" class="caption" text-anchor="middle">Permission detectors are fastest (5–50 ns). ELF detector is 50–600× slower due to file I/O and goblin parsing. True log₁₀ scale Y-axis.</text>
</svg>