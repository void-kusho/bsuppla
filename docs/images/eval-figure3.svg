<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      .axis { stroke: #cbd5e1; stroke-width: 1; }
      .axis-label { font: 500 11px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
      .tick-label { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .line-time { fill: none; stroke: #3b82f6; stroke-width: 2.5; }
      .line-memory { fill: none; stroke: #16a34a; stroke-width: 2.5; }
      .dot { r: 4; }
      .dot-time { fill: #3b82f6; }
      .dot-memory { fill: #16a34a; }
      .regression { fill: none; stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .legend-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .legend-item { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #334155; }
      .title { font: 600 14px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
      .caption { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .grid-line { stroke: #e2e8f0; stroke-width: 0.5; }
      .formula { font: 400 10px 'JetBrains Mono', 'Fira Code', monospace; fill: #ef4444; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Figure 3: Scalability — Scan Time & Memory vs File Count</text>

  <g transform="translate(100, 40)">
    <!-- Y Axis (Time - left) -->
    <line x1="0" y1="0" x2="0" y2="340" class="axis" stroke="#3b82f6"/>
    <!-- Y Axis (Memory - right) -->
    <line x1="640" y1="0" x2="640" y2="340" class="axis" stroke="#16a34a"/>
    <!-- X Axis -->
    <line x1="0" y1="340" x2="640" y2="340" class="axis"/>

    <!-- Y Grid Lines & Labels (Time - left, ms) -->
    <line x1="0" y1="42.5" x2="640" y2="42.5" class="grid-line"/>
    <text x="-10" y="46" class="tick-label" text-anchor="end" fill="#3b82f6">200 ms</text>
    <line x1="0" y1="85" x2="640" y2="85" class="grid-line"/>
    <text x="-10" y="89" class="tick-label" text-anchor="end" fill="#3b82f6">150 ms</text>
    <line x1="0" y1="127.5" x2="640" y2="127.5" class="grid-line"/>
    <text x="-10" y="131" class="tick-label" text-anchor="end" fill="#3b82f6">100 ms</text>
    <line x1="0" y1="170" x2="640" y2="170" class="grid-line"/>
    <text x="-10" y="174" class="tick-label" text-anchor="end" fill="#3b82f6">50 ms</text>
    <line x1="0" y1="212.5" x2="640" y2="212.5" class="grid-line"/>
    <text x="-10" y="216" class="tick-label" text-anchor="end" fill="#3b82f6">20 ms</text>
    <line x1="0" y1="255" x2="640" y2="255" class="grid-line"/>
    <text x="-10" y="259" class="tick-label" text-anchor="end" fill="#3b82f6">10 ms</text>
    <line x1="0" y1="297.5" x2="640" y2="297.5" class="grid-line"/>
    <text x="-10" y="301" class="tick-label" text-anchor="end" fill="#3b82f6">5 ms</text>
    <line x1="0" y1="340" x2="640" y2="340" class="grid-line"/>
    <text x="-10" y="344" class="tick-label" text-anchor="end" fill="#3b82f6">0</text>

    <!-- Y Grid Lines & Labels (Memory - right, MB) -->
    <text x="650" y="46" class="tick-label" text-anchor="start" fill="#16a34a">140 MB</text>
    <text x="650" y="89" class="tick-label" text-anchor="start" fill="#16a34a">105 MB</text>
    <text x="650" y="131" class="tick-label" text-anchor="start" fill="#16a34a">70 MB</text>
    <text x="650" y="174" class="tick-label" text-anchor="start" fill="#16a34a">35 MB</text>
    <text x="650" y="216" class="tick-label" text-anchor="start" fill="#16a34a">20 MB</text>
    <text x="650" y="259" class="tick-label" text-anchor="start" fill="#16a34a">10 MB</text>
    <text x="650" y="301" class="tick-label" text-anchor="start" fill="#16a34a">5 MB</text>
    <text x="650" y="344" class="tick-label" text-anchor="start" fill="#16a34a">0</text>

    <!-- Y Axis Labels -->
    <text x="-55" y="170" class="axis-label" text-anchor="middle" transform="rotate(-90 -55 170)" fill="#3b82f6">Scan Time (ms)</text>
    <text x="695" y="170" class="axis-label" text-anchor="middle" transform="rotate(90 695 170)" fill="#16a34a">Peak RSS (MB)</text>

    <!-- Data Points -->
    <!-- Files: 1000, 5000, 10000, 25000, 50000 -->
    <!-- X positions: 40, 160, 280, 460, 600 (roughly log-spaced) -->
    <!-- Time (ms): 4.8, 22.6, 42.8, 102, 212 -->
    <!-- Y positions: 340 - (time/200)*340 -->
    <!-- 4.8ms -> 340 - 8.16 = 331.8 -->
    <!-- 22.6ms -> 340 - 38.4 = 301.6 -->
    <!-- 42.8ms -> 340 - 72.8 = 267.2 -->
    <!-- 102ms -> 340 - 173.4 = 166.6 -->
    <!-- 212ms -> 340 - 360.4 = -20.4 (clamp to ~10) -->
    <!-- Memory (MB): 8, 18, 32, 68, 131 -->
    <!-- Y positions: 340 - (mem/140)*340 -->
    <!-- 8MB -> 340 - 19.4 = 320.6 -->
    <!-- 18MB -> 340 - 43.7 = 296.3 -->
    <!-- 32MB -> 340 - 77.7 = 262.3 -->
    <!-- 68MB -> 340 - 165.1 = 174.9 -->
    <!-- 131MB -> 340 - 318.1 = 21.9 -->

    <!-- Time Line -->
    <path d="M 40 332 L 160 302 L 280 267 L 460 167 L 600 20" class="line-time"/>

    <!-- Time Dots -->
    <circle cx="40" cy="332" class="dot dot-time"/>
    <circle cx="160" cy="302" class="dot dot-time"/>
    <circle cx="280" cy="267" class="dot dot-time"/>
    <circle cx="460" cy="167" class="dot dot-time"/>
    <circle cx="600" cy="20" class="dot dot-time"/>

    <!-- Memory Line -->
    <path d="M 40 321 L 160 296 L 280 262 L 460 175 L 600 22" class="line-memory"/>

    <!-- Memory Dots -->
    <circle cx="40" cy="321" class="dot dot-memory"/>
    <circle cx="160" cy="296" class="dot dot-memory"/>
    <circle cx="280" cy="262" class="dot dot-memory"/>
    <circle cx="460" cy="175" class="dot dot-memory"/>
    <circle cx="600" cy="22" class="dot dot-memory"/>

    <!-- Regression Lines (dashed) -->
    <!-- Time: y = 0.0041x + 0.7 -->
    <!-- At x=1000 (x=40): y=4.8ms -> 332 -->
    <!-- At x=50000 (x=600): y=205.7ms -> ~30 -->
    <path d="M 40 332 L 600 30" class="regression" stroke="#3b82f6"/>
    <!-- Memory: y = 0.0025x + 5.8 -->
    <!-- At x=1000 (x=40): y=8.3MB -> 320 -->
    <!-- At x=50000 (x=600): y=130.8MB -> 23 -->
    <path d="M 40 320 L 600 23" class="regression" stroke="#16a34a"/>

    <!-- X Axis Labels -->
    <g font-size="11" fill="#334155" text-anchor="middle">
      <text x="40" y="365">1,000</text>
      <text x="160" y="365">5,000</text>
      <text x="280" y="365">10,000</text>
      <text x="460" y="365">25,000</text>
      <text x="600" y="365">50,000</text>
    </g>
    <text x="320" y="390" class="axis-label" text-anchor="middle">File Count</text>

    <!-- Data Value Labels -->
    <g font-size="9" font-weight="500" text-anchor="middle">
      <text x="40" y="328" fill="#3b82f6">4.8ms</text>
      <text x="40" y="315" fill="#16a34a">8MB</text>
      <text x="160" y="298" fill="#3b82f6">22.6ms</text>
      <text x="160" y="292" fill="#16a34a">18MB</text>
      <text x="280" y="263" fill="#3b82f6">42.8ms</text>
      <text x="280" y="257" fill="#16a34a">32MB</text>
      <text x="460" y="163" fill="#3b82f6">102ms</text>
      <text x="460" y="157" fill="#16a34a">68MB</text>
      <text x="600" y="16" fill="#3b82f6">212ms</text>
      <text x="600" y="10" fill="#16a34a">131MB</text>
    </g>
  </g>

  <!-- Legend -->
  <rect x="580" y="60" width="200" height="100" class="legend-box"/>
  <line x1="590" y1="75" x2="610" y2="75" class="line-time" stroke-width="3"/>
  <text x="615" y="79" class="legend-item">Scan Time (ms) — measured</text>
  <line x1="590" y1="95" x2="610" y2="95" class="line-memory" stroke-width="3"/>
  <text x="615" y="99" class="legend-item">Peak RSS (MB) — measured</text>
  <path d="M 590 115 L 610 115" class="regression" stroke="#3b82f6"/>
  <text x="615" y="119" class="legend-item" fill="#ef4444">Time: y = 0.0041x + 0.7 (R²=0.998)</text>
  <path d="M 590 133 L 610 133" class="regression" stroke="#16a34a"/>
  <text x="615" y="137" class="legend-item" fill="#ef4444">Memory: y = 0.0025x + 5.8 (R²=0.992)</text>

  <!-- Caption -->
  <text x="400" y="430" class="caption" text-anchor="middle">Scan time scales linearly with file count (R² = 0.998). Memory scales sub-linearly due to streaming extraction (R² = 0.992).</text>
</svg>