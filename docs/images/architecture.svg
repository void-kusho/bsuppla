<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520">
  <defs>
    <style>
      .module-box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 6; }
      .core-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 8; }
      .detector-box { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .ingest-box { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.5; rx: 6; }
      .scan-box { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.5; rx: 6; }
      .title { font: 600 14px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
      .section-title { font: 600 12px 'Segoe UI', system-ui, sans-serif; fill: #334155; }
      .module-name { font: 500 11px 'JetBrains Mono', 'Fira Code', monospace; fill: #334155; }
      .module-desc { font: 400 9px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .detector-name { font: 500 11px 'Segoe UI', system-ui, sans-serif; fill: #166534; }
      .detector-detail { font: 400 9px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #94a3b8; stroke-width: 1.5; marker-end: url(#arrowhead); stroke-dasharray: 4 3; }
      .arrow-solid { fill: none; stroke: #3b82f6; stroke-width: 2; marker-end: url(#arrowhead); }
      .legend-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .legend-item { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #334155; }
      .trait-note { font: 500 10px 'Segoe UI', system-ui, sans-serif; fill: #3b82f6; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="420" y="25" class="title" text-anchor="middle">bsuppla Module Architecture</text>

  <!-- ==================== CORE LAYER (bottom) ==================== -->
  <rect x="60" y="420" width="720" height="80" class="core-box"/>
  <text x="420" y="442" class="section-title" text-anchor="middle">Core Extension API (core.rs)</text>
  <text x="150" y="462" class="module-name">Detector trait</text>
  <text x="150" y="476" class="module-desc">name(), detect(), severity()</text>
  <text x="300" y="462" class="module-name">DetectorRegistry</text>
  <text x="300" y="476" class="module-desc">register(), detect() → Vec<Finding></text>
  <text x="480" y="462" class="module-name">PathRule</text>
  <text x="480" y="476" class="module-desc">Zero-boilerplate path predicates</text>
  <text x="650" y="462" class="module-name">Finding / Severity / FileContext</text>
  <text x="650" y="476" class="module-desc">Domain types shared by all</text>

  <!-- Arrow from core up to pipeline -->
  <path d="M420 420 L420 405" class="arrow-solid"/>

  <!-- ==================== PIPELINE (center) ==================== -->
  <rect x="310" y="360" width="220" height="50" class="module-box" style="fill:#fef3c7;stroke:#f59e0b;stroke-width:2;"/>
  <text x="420" y="382" class="section-title" text-anchor="middle">pipeline.rs</text>
  <text x="420" y="398" class="module-desc" text-anchor="middle">run(Config) → orchestrates ingest + scan</text>

  <!-- Arrows from pipeline to ingest and scan -->
  <path d="M310 385 L240 340" class="arrow"/>
  <path d="M530 385 L600 340" class="arrow"/>

  <!-- ==================== INGEST DOMAIN (left) ==================== -->
  <rect x="40" y="140" width="240" height="210" class="ingest-box"/>
  <text x="160" y="162" class="section-title" text-anchor="middle">ingest/ (Input Domain)</text>
  
  <text x="70" y="190" class="module-name">docker.rs</text>
  <text x="70" y="204" class="module-desc">pull() / save() → image.tar</text>
  
  <text x="70" y="224" class="module-name">image.rs</text>
  <text x="70" y="238" class="module-desc">read_manifest_from_image()</text>
  
  <text x="70" y="258" class="module-name">manifest.rs</text>
  <text x="70" y="272" class="module-desc">Manifest parsing</text>
  
  <text x="70" y="292" class="module-name">layers.rs</text>
  <text x="70" y="306" class="module-desc">locate_layers() verification</text>
  
  <text x="70" y="326" class="module-name">extract.rs</text>
  <text x="70" y="340" class="module-desc">build_filesystem() reconstruction</text>

  <!-- Arrow from ingest up to pipeline -->
  <path d="M160 140 L160 125" class="arrow"/>
  <path d="M160 125 L310 360" class="arrow"/>

  <!-- ==================== SCAN DOMAIN (right) ==================== -->
  <rect x="560" y="140" width="240" height="210" class="scan-box"/>
  <text x="680" y="162" class="section-title" text-anchor="middle">scan/ (Analysis Domain)</text>
  
  <text x="590" y="190" class="module-name">scanner.rs</text>
  <text x="590" y="204" class="module-desc">walk_dir() + registry execution</text>
  
  <text x="590" y="224" class="module-name">allowlist.rs</text>
  <text x="590" y="238" class="module-desc">load_allowlist() / is_allowlisted()</text>
  
  <text x="590" y="258" class="module-name">baseline.rs</text>
  <text x="590" y="272" class="module-desc">load_baseline() / diff / export</text>
  
  <text x="590" y="292" class="module-name">report.rs</text>
  <text x="590" y="306" class="module-desc">report_findings() + suspicion level</text>

  <!-- Arrow from scan up to pipeline -->
  <path d="M680 140 L680 125" class="arrow"/>
  <path d="M680 125 L530 360" class="arrow"/>

  <!-- ==================== DETECTORS (top) ==================== -->
  <rect x="40" y="20" width="760" height="110" class="module-box" style="fill:#f0fdf4;stroke:#16a34a;stroke-width:2;"/>
  <text x="420" y="42" class="section-title" text-anchor="middle">detectors/ (Extension Surface — 5 Categories, 15 Detectors)</text>

  <!-- 5 Detector Boxes in a row -->
  <!-- 1. Permissions -->
  <rect x="60" y="55" width="145" height="65" class="detector-box"/>
  <text x="132.5" y="72" class="detector-name" text-anchor="middle">permissions.rs</text>
  <text x="132.5" y="86" class="detector-detail" text-anchor="middle">SuidSgid, WorldWritable,</text>
  <text x="132.5" y="98" class="detector-detail" text-anchor="middle">ExecInWritable, HiddenExec,</text>
  <text x="132.5" y="110" class="detector-detail" text-anchor="middle">InsecureShadow  (5 detectors)</text>

  <!-- 2. ELF -->
  <rect x="220" y="55" width="145" height="65" class="detector-box"/>
  <text x="292.5" y="72" class="detector-name" text-anchor="middle">elf.rs</text>
  <text x="292.5" y="86" class="detector-detail" text-anchor="middle">ElfAnalyzerDetector</text>
  <text x="292.5" y="98" class="detector-detail" text-anchor="middle">Stripped, Static, Packed,</text>
  <text x="292.5" y="110" class="detector-detail" text-anchor="middle">UnusualLocation  (2 signals)</text>

  <!-- 3. Credentials -->
  <rect x="380" y="55" width="145" height="65" class="detector-box"/>
  <text x="452.5" y="72" class="detector-name" text-anchor="middle">credentials.rs</text>
  <text x="452.5" y="86" class="detector-detail" text-anchor="middle">PrivateKey, AuthorizedKeys,</text>
  <text x="452.5" y="98" class="detector-detail" text-anchor="middle">CredentialFile  (3 detectors)</text>

  <!-- 4. Package Managers -->
  <rect x="540" y="55" width="145" height="65" class="detector-box"/>
  <text x="612.5" y="72" class="detector-name" text-anchor="middle">package_managers.rs</text>
  <text x="612.5" y="86" class="detector-detail" text-anchor="middle">PkgManagerConfig, Lockfile,</text>
  <text x="612.5" y="98" class="detector-detail" text-anchor="middle">ApkRepository, ApkKey  (4 detectors)</text>

  <!-- 5. Risky -->
  <rect x="700" y="55" width="145" height="65" class="detector-box"/>
  <text x="772.5" y="72" class="detector-name" text-anchor="middle">risky.rs</text>
  <text x="772.5" y="86" class="detector-detail" text-anchor="middle">RiskyTool, CryptoMiner,</text>
  <text x="772.5" y="98" class="detector-detail" text-anchor="middle">StartupScript  (3 detectors)</text>

  <!-- Arrow from detectors down to scan/scanner -->
  <path d="M132 130 L160 140" class="arrow-solid"/>
  <path d="M292 130 L160 140" class="arrow-solid"/>
  <path d="M452 130 L160 140" class="arrow-solid"/>
  <path d="M612 130 L590 140" class="arrow-solid"/>
  <path d="M772 130 L590 140" class="arrow-solid"/>

  <!-- ==================== CONFIG & MAIN (top-left) ==================== -->
  <rect x="40" y="20" width="140" height="30" class="module-box" style="fill:#e0e7ff;stroke:#6366f1;" transform="translate(0, -20)"/>
  <text x="110" y="22" class="module-name" text-anchor="middle" transform="translate(0, -20)">config.rs</text>
  <text x="110" y="36" class="module-desc" text-anchor="middle" transform="translate(0, -20)">CLI + env → Config</text>

  <rect x="200" y="20" width="120" height="30" class="module-box" style="fill:#e0e7ff;stroke:#6366f1;" transform="translate(0, -20)"/>
  <text x="260" y="22" class="module-name" text-anchor="middle" transform="translate(0, -20)">main.rs</text>
  <text x="260" y="36" class="module-desc" text-anchor="middle" transform="translate(0, -20)">Entry point</text>

  <!-- Arrow from config/main to pipeline -->
  <path d="M110 50 L310 360" class="arrow" transform="translate(0, -20)"/>
  <path d="M260 50 L310 360" class="arrow" transform="translate(0, -20)"/>

  <!-- ==================== LEGEND ==================== -->
  <rect x="60" y="20" width="200" height="110" class="legend-box" style="pointer-events:none;" />
  <text x="75" y="35" class="legend-item"><tspan style="fill:#3b82f6">■</tspan> Core API (core.rs)</text>
  <text x="75" y="52" class="legend-item"><tspan style="fill:#f59e0b">■</tspan> Pipeline (pipeline.rs)</text>
  <text x="75" y="69" class="legend-item"><tspan style="fill:#f59e0b">■</tspan> Ingest Domain</text>
  <text x="75" y="86" class="legend-item"><tspan style="fill:#a855f7">■</tspan> Scan Domain</text>
  <text x="75" y="103" class="legend-item"><tspan style="fill:#16a34a">■</tspan> Detectors (5 categories)</text>
  <text x="75" y="120" class="legend-item"><tspan style="fill:#6366f1">■</tspan> Config / Entry</text>

  <!-- Trait annotation at bottom -->
  <text x="420" y="508" class="trait-note" text-anchor="middle">All detectors implement Detector trait • Registered in default_registry() • Open/Closed Principle • Zero-boilerplate PathRule support</text>
</svg>