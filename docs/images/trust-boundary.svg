<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <style>
      .trusted-zone { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 12; }
      .analysis-boundary { fill: #fef3c7; stroke: #f59e0b; stroke-width: 3; rx: 12; }
      .untrusted { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; rx: 8; }
      .trusted { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .semi-trusted { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 8; }
      .title { font: 600 16px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
      .zone-title { font: 600 13px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
      .component { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #334155; }
      .component-desc { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrowhead); stroke-dasharray: 4 3; }
      .arrow-solid { fill: none; stroke: #3b82f6; stroke-width: 2; marker-end: url(#arrowhead); }
      .skip-label { font: 500 10px 'Segoe UI', system-ui, sans-serif; fill: #f59e0b; }
      .note { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Outer Trusted Host -->
  <rect x="20" y="20" width="760" height="480" class="trusted-zone"/>
  <text x="400" y="45" class="title" text-anchor="middle">TRUSTED HOST</text>

  <!-- Top Row: Trusted Components -->
  <!-- bsuppla Binary -->
  <rect x="60" y="70" width="200" height="90" class="trusted"/>
  <text x="160" y="95" class="component" text-anchor="middle">bsuppla Binary</text>
  <text x="160" y="115" class="component-desc" text-anchor="middle">(Trusted)</text>
  <text x="160" y="135" class="component-desc" text-anchor="middle">Audited, version-controlled</text>
  <text x="160" y="150" class="component-desc" text-anchor="middle">compiled from source</text>

  <!-- Docker Daemon -->
  <rect x="300" y="70" width="200" height="90" class="semi-trusted"/>
  <text x="400" y="95" class="component" text-anchor="middle">Docker Daemon</text>
  <text x="400" y="115" class="component-desc" text-anchor="middle">(Trusted*)</text>
  <text x="400" y="135" class="component-desc" text-anchor="middle">Only for pull/save</text>
  <text x="400" y="150" class="component-desc" text-anchor="middle">Skipped via BSUPPLA_SKIP_DOCKER</text>

  <!-- Host Kernel/FS -->
  <rect x="540" y="70" width="200" height="90" class="trusted"/>
  <text x="640" y="95" class="component" text-anchor="middle">Host Kernel / FS</text>
  <text x="640" y="115" class="component-desc" text-anchor="middle">(Trusted)</text>
  <text x="640" y="135" class="component-desc" text-anchor="middle">Mediates filesystem access</text>

  <!-- Arrows from top components down -->
  <path d="M160 160 L160 190" class="arrow"/>
  <path d="M400 160 L400 190" class="arrow"/>
  <path d="M640 160 L640 190" class="arrow"/>

  <!-- Labels on arrows -->
  <text x="180" y="180" class="skip-label" text-anchor="middle">BSUPPLA_SKIP_DOCKER</text>
  <text x="420" y="180" class="skip-label" text-anchor="middle">docker pull/save</text>
  <text x="660" y="180" class="skip-label" text-anchor="middle">(optional)</text>

  <!-- Analysis Boundary -->
  <rect x="60" y="190" width="680" height="280" class="analysis-boundary"/>
  <text x="400" y="215" class="zone-title" text-anchor="middle">ANALYSIS BOUNDARY</text>

  <!-- Inside Analysis Boundary: Three columns -->
  <!-- Input Column -->
  <rect x="100" y="235" width="180" height="210" class="untrusted"/>
  <text x="190" y="260" class="component" text-anchor="middle">Input</text>
  <text x="190" y="280" class="component-desc" text-anchor="middle">Docker Image</text>
  <text x="190" y="300" class="component-desc" text-anchor="middle">(UNTRUSTED)</text>
  <text x="190" y="330" class="component-desc" text-anchor="middle">External input</text>
  <text x="190" y="345" class="component-desc" text-anchor="middle">may be malicious</text>
  <text x="190" y="370" class="component-desc" text-anchor="middle">Zero execution</text>
  <text x="190" y="385" class="component-desc" text-anchor="middle">Read-only analysis</text>

  <!-- Processing Column -->
  <rect x="310" y="235" width="180" height="210" class="trusted"/>
  <text x="400" y="260" class="component" text-anchor="middle">Processing</text>
  <text x="400" y="280" class="component-desc" text-anchor="middle">Extract + Scan</text>
  <text x="400" y="300" class="component-desc" text-anchor="middle">(Trusted)</text>
  <text x="400" y="330" class="component-desc" text-anchor="middle">ingest/extract.rs</text>
  <text x="400" y="345" class="component-desc" text-anchor="middle">scan/scanner.rs</text>
  <text x="400" y="360" class="component-desc" text-anchor="middle">detectors/registry</text>
  <text x="400" y="375" class="component-desc" text-anchor="middle">Pure functions only</text>
  <text x="400" y="390" class="component-desc" text-anchor="middle">No I/O in detectors</text>

  <!-- Output Column -->
  <rect x="520" y="235" width="180" height="210" class="trusted"/>
  <text x="610" y="260" class="component" text-anchor="middle">Output</text>
  <text x="610" y="280" class="component-desc" text-anchor="middle">Findings +</text>
  <text x="610" y="300" class="component-desc" text-anchor="middle">Suspicion</text>
  <text x="610" y="320" class="component-desc" text-anchor="middle">(Trusted)</text>
  <text x="610" y="345" class="component-desc" text-anchor="middle">Generated by</text>
  <text x="610" y="360" class="component-desc" text-anchor="middle">verified code</text>
  <text x="610" y="385" class="component-desc" text-anchor="middle">Deterministic</text>
  <text x="610" y="400" class="component-desc" text-anchor="middle">Reproducible</text>

  <!-- Arrows between columns inside analysis boundary -->
  <path d="M280 330 L310 330" class="arrow-solid"/>
  <path d="M490 330 L520 330" class="arrow-solid"/>

  <!-- Arrow labels -->
  <text x="295" y="320" font="500 9px 'Segoe UI', system-ui, sans-serif" fill="#3b82f6" text-anchor="middle">filesystem</text>
  <text x="505" y="320" font="500 9px 'Segoe UI', system-ui, sans-serif" fill="#3b82f6" text-anchor="middle">findings</text>

  <!-- Footer note -->
  <text x="400" y="490" class="note" text-anchor="middle">* Docker daemon only used for acquisition phase; skipped if BSUPPLA_SKIP_DOCKER=1</text>
</svg>