<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <style>
      .trusted-zone { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .analysis-boundary { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2.5; rx: 10; }
      .untrusted { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; rx: 8; }
      .trusted { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .semi-trusted { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 8; }
      .title { font: 600 14px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
      .zone-title { font: 600 11px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
      .component { font: 500 10px 'Segoe UI', system-ui, sans-serif; fill: #334155; }
      .component-desc { font: 400 8px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #94a3b8; stroke-width: 1.5; marker-end: url(#arrowhead); stroke-dasharray: 4 3; }
      .arrow-solid { fill: none; stroke: #3b82f6; stroke-width: 2; marker-end: url(#arrowhead); }
      .skip-label { font: 500 9px 'Segoe UI', system-ui, sans-serif; fill: #f59e0b; }
      .note { font: 400 9px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Outer Trusted Host -->
  <rect x="15" y="15" width="770" height="390" class="trusted-zone"/>
  <text x="400" y="38" class="title" text-anchor="middle">TRUSTED HOST</text>

  <!-- Top Row: Trusted Components -->
  <!-- bsuppla Binary -->
  <rect x="50" y="55" width="180" height="75" class="trusted"/>
  <text x="140" y="73" class="component" text-anchor="middle">bsuppla Binary</text>
  <text x="140" y="88" class="component-desc" text-anchor="middle">(Trusted)</text>
  <text x="140" y="102" class="component-desc" text-anchor="middle">Audited, version-controlled</text>
  <text x="140" y="116" class="component-desc" text-anchor="middle">compiled from source</text>

  <!-- Docker Daemon -->
  <rect x="310" y="55" width="180" height="75" class="semi-trusted"/>
  <text x="400" y="73" class="component" text-anchor="middle">Docker Daemon</text>
  <text x="400" y="88" class="component-desc" text-anchor="middle">(Trusted*)</text>
  <text x="400" y="102" class="component-desc" text-anchor="middle">Only for pull/save</text>
  <text x="400" y="116" class="component-desc" text-anchor="middle">Skipped via BSUPPLA_SKIP_DOCKER</text>

  <!-- Host Kernel/FS -->
  <rect x="570" y="55" width="180" height="75" class="trusted"/>
  <text x="660" y="73" class="component" text-anchor="middle">Host Kernel / FS</text>
  <text x="660" y="88" class="component-desc" text-anchor="middle">(Trusted)</text>
  <text x="660" y="102" class="component-desc" text-anchor="middle">Mediates filesystem access</text>

  <!-- Arrows from top components down -->
  <path d="M140 130 L140 150" class="arrow"/>
  <path d="M400 130 L400 150" class="arrow"/>
  <path d="M660 130 L660 150" class="arrow"/>

  <!-- Labels on arrows -->
  <text x="160" y="145" class="skip-label" text-anchor="middle">BSUPPLA_SKIP_DOCKER</text>
  <text x="420" y="145" class="skip-label" text-anchor="middle">docker pull/save (optional)</text>

  <!-- Analysis Boundary -->
  <rect x="50" y="150" width="700" height="240" class="analysis-boundary"/>
  <text x="400" y="170" class="zone-title" text-anchor="middle">ANALYSIS BOUNDARY</text>

  <!-- Inside Analysis Boundary: Three columns -->
  <!-- Input Column -->
  <rect x="90" y="190" width="160" height="180" class="untrusted"/>
  <text x="170" y="210" class="component" text-anchor="middle">Input</text>
  <text x="170" y="228" class="component-desc" text-anchor="middle">Docker Image</text>
  <text x="170" y="242" class="component-desc" text-anchor="middle">(UNTRUSTED)</text>
  <text x="170" y="268" class="component-desc" text-anchor="middle">External input</text>
  <text x="170" y="282" class="component-desc" text-anchor="middle">may be malicious</text>
  <text x="170" y="308" class="component-desc" text-anchor="middle">Zero execution</text>
  <text x="170" y="322" class="component-desc" text-anchor="middle">Read-only analysis</text>

  <!-- Processing Column -->
  <rect x="320" y="190" width="160" height="180" class="trusted"/>
  <text x="400" y="210" class="component" text-anchor="middle">Processing</text>
  <text x="400" y="228" class="component-desc" text-anchor="middle">Extract + Scan</text>
  <text x="400" y="242" class="component-desc" text-anchor="middle">(Trusted)</text>
  <text x="400" y="268" class="component-desc" text-anchor="middle">ingest/extract.rs</text>
  <text x="400" y="282" class="component-desc" text-anchor="middle">scan/scanner.rs</text>
  <text x="400" y="296" class="component-desc" text-anchor="middle">detectors/registry</text>
  <text x="400" y="310" class="component-desc" text-anchor="middle">Pure functions only</text>
  <text x="400" y="324" class="component-desc" text-anchor="middle">No I/O in detectors</text>

  <!-- Output Column -->
  <rect x="550" y="190" width="160" height="180" class="trusted"/>
  <text x="630" y="210" class="component" text-anchor="middle">Output</text>
  <text x="630" y="228" class="component-desc" text-anchor="middle">Findings +</text>
  <text x="630" y="242" class="component-desc" text-anchor="middle">Suspicion</text>
  <text x="630" y="268" class="component-desc" text-anchor="middle">(Trusted)</text>
  <text x="630" y="282" class="component-desc" text-anchor="middle">Generated by</text>
  <text x="630" y="296" class="component-desc" text-anchor="middle">verified code</text>
  <text x="630" y="310" class="component-desc" text-anchor="middle">Deterministic</text>
  <text x="630" y="324" class="component-desc" text-anchor="middle">Reproducible</text>

  <!-- Arrows between columns inside analysis boundary -->
  <path d="M250 280 L320 280" class="arrow-solid"/>
  <path d="M480 280 L550 280" class="arrow-solid"/>

  <!-- Arrow labels -->
  <text x="285" y="272" font="500 8px 'Segoe UI', system-ui, sans-serif" fill="#3b82f6" text-anchor="middle">filesystem</text>
  <text x="515" y="272" font="500 8px 'Segoe UI', system-ui, sans-serif" fill="#3b82f6" text-anchor="middle">findings</text>

  <!-- Footer note -->
  <text x="400" y="405" class="note" text-anchor="middle">* Docker daemon only used for acquisition phase; skipped if BSUPPLA_SKIP_DOCKER=1</text>
</svg>