<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      .axis { stroke: #cbd5e1; stroke-width: 1; }
      .axis-label { font: 500 11px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
      .tick-label { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .bar-pull { fill: #ef4444; }
      .bar-extract { fill: #f59e0b; }
      .bar-scan { fill: #3b82f6; }
      .legend-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .legend-item { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #334155; }
      .title { font: 600 14px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
      .caption { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .grid-line { stroke: #e2e8f0; stroke-width: 0.5; }
      .value-label { font: 500 9px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Figure 2: End-to-End Time Breakdown by Image</text>

  <g transform="translate(100, 40)">
    <!-- Y Axis -->
    <line x1="0" y1="0" x2="0" y2="340" class="axis"/>
    <!-- X Axis -->
    <line x1="0" y1="340" x2="640" y2="340" class="axis"/>

    <!-- Y Grid Lines & Labels (seconds) -->
    <line x1="0" y1="42.5" x2="640" y2="42.5" class="grid-line"/>
    <text x="-10" y="46" class="tick-label" text-anchor="end">20 s</text>
    <line x1="0" y1="85" x2="640" y2="85" class="grid-line"/>
    <text x="-10" y="89" class="tick-label" text-anchor="end">15 s</text>
    <line x1="0" y1="127.5" x2="640" y2="127.5" class="grid-line"/>
    <text x="-10" y="131" class="tick-label" text-anchor="end">10 s</text>
    <line x1="0" y1="170" x2="640" y2="170" class="grid-line"/>
    <text x="-10" y="174" class="tick-label" text-anchor="end">5 s</text>
    <line x1="0" y1="212.5" x2="640" y2="212.5" class="grid-line"/>
    <text x="-10" y="216" class="tick-label" text-anchor="end">2 s</text>
    <line x1="0" y1="255" x2="640" y2="255" class="grid-line"/>
    <text x="-10" y="259" class="tick-label" text-anchor="end">1 s</text>
    <line x1="0" y1="297.5" x2="640" y2="297.5" class="grid-line"/>
    <text x="-10" y="301" class="tick-label" text-anchor="end">500 ms</text>
    <line x1="0" y1="340" x2="640" y2="340" class="grid-line"/>
    <text x="-10" y="344" class="tick-label" text-anchor="end">0</text>

    <!-- Y Axis Label -->
    <text x="-55" y="170" class="axis-label" text-anchor="middle" transform="rotate(-90 -55 170)">Time (seconds, log scale)</text>

    <!-- Stacked Bars (80px wide each, 20px gap) -->
    <!-- alpine: 1.26s total - pull 1.2s, extract 0.045s, scan 0.018s -->
    <rect x="20" y="68" width="80" height="272" class="bar-pull"/>
    <rect x="20" y="38" width="80" height="30" class="bar-extract"/>
    <rect x="20" y="34" width="80" height="4" class="bar-scan"/>
    <text x="60" y="30" class="value-label" text-anchor="middle">1.26s</text>

    <!-- debian: 3.05s - pull 2.8s, extract 0.187s, scan 0.062s -->
    <rect x="120" y="80" width="80" height="260" class="bar-pull"/>
    <rect x="120" y="48" width="80" height="32" class="bar-extract"/>
    <rect x="120" y="42" width="80" height="6" class="bar-scan"/>
    <text x="160" y="40" class="value-label" text-anchor="middle">3.05s</text>

    <!-- ubuntu: 3.38s - pull 3.1s, extract 0.212s, scan 0.071s -->
    <rect x="220" y="72" width="80" height="268" class="bar-pull"/>
    <rect x="220" y="45" width="80" height="27" class="bar-extract"/>
    <rect x="220" y="38" width="80" height="7" class="bar-scan"/>
    <text x="260" y="34" class="value-label" text-anchor="middle">3.38s</text>

    <!-- node: 20.5s - pull 18.4s, extract 1.84s, scan 0.245s -->
    <rect x="320" y="40" width="80" height="300" class="bar-pull"/>
    <rect x="320" y="20" width="80" height="20" class="bar-extract"/>
    <rect x="320" y="16" width="80" height="4" class="bar-scan"/>
    <text x="360" y="12" class="value-label" text-anchor="middle">20.5s</text>

    <!-- python: 18.1s - pull 16.2s, extract 1.67s, scan 0.221s -->
    <rect x="420" y="48" width="80" height="292" class="bar-pull"/>
    <rect x="420" y="25" width="80" height="23" class="bar-extract"/>
    <rect x="420" y="21" width="80" height="4" class="bar-scan"/>
    <text x="460" y="17" class="value-label" text-anchor="middle">18.1s</text>

    <!-- golang: 23.3s - pull 21.1s, extract 2.01s, scan 0.198s -->
    <rect x="520" y="32" width="80" height="308" class="bar-pull"/>
    <rect x="520" y="12" width="80" height="20" class="bar-extract"/>
    <rect x="520" y="9" width="80" height="3" class="bar-scan"/>
    <text x="560" y="5" class="value-label" text-anchor="middle">23.3s</text>

    <!-- X Axis Labels -->
    <g font-size="11" fill="#334155" text-anchor="middle">
      <text x="60" y="365">alpine:latest</text>
      <text x="160" y="365">debian:slim</text>
      <text x="260" y="365">ubuntu:latest</text>
      <text x="360" y="365">node:20</text>
      <text x="460" y="365">python:3.11</text>
      <text x="560" y="365">golang:1.21</text>
    </g>

    <!-- Image size labels -->
    <g font-size="9" fill="#64748b" text-anchor="middle">
      <text x="60" y="380">5.6 MB • 1L • 3.2K files</text>
      <text x="160" y="380">69 MB • 1L • 14.8K files</text>
      <text x="260" y="380">77 MB • 1L • 18.5K files</text>
      <text x="360" y="380">1.1 GB • 4L • 42.1K files</text>
      <text x="460" y="380">1.0 GB • 4L • 38.3K files</text>
      <text x="560" y="380">1.3 GB • 5L • 27.8K files</text>
    </g>
  </g>

  <!-- Legend -->
  <rect x="580" y="60" width="180" height="80" class="legend-box"/>
  <rect x="590" y="72" width="14" height="14" rx="2" fill="#ef4444"/>
  <text x="610" y="82" class="legend-item">Docker Pull + Save</text>
  <rect x="590" y="90" width="14" height="14" rx="2" fill="#f59e0b"/>
  <text x="610" y="100" class="legend-item">Layer Extraction</text>
  <rect x="590" y="108" width="14" height="14" rx="2" fill="#3b82f6"/>
  <text x="610" y="118" class="legend-item">Scan Phase</text>

  <!-- Caption -->
  <text x="400" y="430" class="caption" text-anchor="middle">End-to-end time dominated by Docker pull/save (network + tar I/O). Scan phase is <1% of total for large images.</text>
</svg>