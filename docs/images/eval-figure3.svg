<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <style>
      .axis { stroke: #cbd5e1; stroke-width: 1; }
      .axis-label { font: 500 11px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
      .tick-label { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .line-time { fill: none; stroke: #3b82f6; stroke-width: 2.5; }
      .line-memory { fill: none; stroke: #16a34a; stroke-width: 2.5; }
      .dot { r: 4; }
      .dot-time { fill: #3b82f6; }
      .dot-memory { fill: #16a34a; }
      .regression { fill: none; stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .legend-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .legend-item { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #334155; }
      .title { font: 600 14px 'Segoe UI', system-ui, sans-serif; fill: #1e293b; }
      .caption { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .grid-line { stroke: #e2e8f0; stroke-width: 0.5; }
      .formula { font: 400 10px 'JetBrains Mono', 'Fira Code', monospace; fill: #ef4444; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Figure 3: Scalability — Scan Time & Memory vs File Count</text>

  <g transform="translate(90, 40)">
    <!-- Y Axis (Time - left) -->
    <line x1="0" y1="0" x2="0" y2="320" class="axis" stroke="#3b82f6"/>
    <!-- Y Axis (Memory - right) -->
    <line x1="640" y1="0" x2="640" y2="320" class="axis" stroke="#16a34a"/>
    <!-- X Axis -->
    <line x1="0" y1="320" x2="640" y2="320" class="axis"/>

    <!-- Y Grid Lines & Labels (Time - left, ms) -->
    <line x1="0" y1="40" x2="640" y2="40" class="grid-line"/>
    <text x="-10" y="44" class="tick-label" text-anchor="end" fill="#3b82f6">200 ms</text>
    <line x1="0" y1="80" x2="640" y2="80" class="grid-line"/>
    <text x="-10" y="84" class="tick-label" text-anchor="end" fill="#3b82f6">150 ms</text>
    <line x1="0" y1="120" x2="640" y2="120" class="grid-line"/>
    <text x="-10" y="124" class="tick-label" text-anchor="end" fill="#3b82f6">100 ms</text>
    <line x1="0" y1="160" x2="640" y2="160" class="grid-line"/>
    <text x="-10" y="164" class="tick-label" text-anchor="end" fill="#3b82f6">50 ms</text>
    <line x1="0" y1="200" x2="640" y2="200" class="grid-line"/>
    <text x="-10" y="204" class="tick-label" text-anchor="end" fill="#3b82f6">20 ms</text>
    <line x1="0" y1="240" x2="640" y2="240" class="grid-line"/>
    <text x="-10" y="244" class="tick-label" text-anchor="end" fill="#3b82f6">10 ms</text>
    <line x1="0" y1="280" x2="640" y2="280" class="grid-line"/>
    <text x="-10" y="284" class="tick-label" text-anchor="end" fill="#3b82f6">5 ms</text>
    <line x1="0" y1="320" x2="640" y2="320" class="grid-line"/>
    <text x="-10" y="324" class="tick-label" text-anchor="end" fill="#3b82f6">0</text>

    <!-- Y Grid Lines & Labels (Memory - right, MB) -->
    <text x="650" y="44" class="tick-label" text-anchor="start" fill="#16a34a">140 MB</text>
    <text x="650" y="84" class="tick-label" text-anchor="start" fill="#16a34a">105 MB</text>
    <text x="650" y="124" class="tick-label" text-anchor="start" fill="#16a34a">70 MB</text>
    <text x="650" y="164" class="tick-label" text-anchor="start" fill="#16a34a">35 MB</text>
    <text x="650" y="204" class="tick-label" text-anchor="start" fill="#16a34a">20 MB</text>
    <text x="650" y="244" class="tick-label" text-anchor="start" fill="#16a34a">10 MB</text>
    <text x="650" y="284" class="tick-label" text-anchor="start" fill="#16a34a">5 MB</text>
    <text x="650" y="324" class="tick-label" text-anchor="start" fill="#16a34a">0</text>

    <!-- Y Axis Labels -->
    <text x="-55" y="160" class="axis-label" text-anchor="middle" transform="rotate(-90 -55 160)" fill="#3b82f6">Scan Time (ms)</text>
    <text x="695" y="160" class="axis-label" text-anchor="middle" transform="rotate(90 695 160)" fill="#16a34a">Peak RSS (MB)</text>

    <!-- Data Points -->
    <!-- Files: 1000, 5000, 10000, 25000, 50000 -->
    <!-- X positions: log scale: log10(1000)=3, log10(50000)=4.7 -->
    <!-- x = (log10(files) - 3) / 1.7 * 640 -->
    <!-- 1000: x=0 -->
    <!-- 5000: log10=3.7 → x=263 -->
    <!-- 10000: log10=4 → x=376 -->
    <!-- 25000: log10=4.4 → x=527 -->
    <!-- 50000: log10=4.7 → x=640 -->

    <!-- Time (ms): 4.8, 22.6, 42.8, 102, 212 -->
    <!-- y = 320 - (time/212)*320 (linear approximation for display) -->
    <!-- Actually use: y = 320 - (log10(time_ms) / log10(212)) * 320 -->
    <!-- 4.8ms: log10=0.68 → y=320 - (0.68/2.33)*320 = 227 -->
    <!-- 22.6ms: log10=1.35 → y=320 - (1.35/2.33)*320 = 135 -->
    <!-- 42.8ms: log10=1.63 → y=320 - (1.63/2.33)*320 = 96 -->
    <!-- 102ms: log10=2.01 → y=320 - (2.01/2.33)*320 = 44 -->
    <!-- 212ms: log10=2.33 → y=320 - (2.33/2.33)*320 = 0 -->

    <!-- Memory (MB): 8, 18, 32, 68, 131 -->
    <!-- y = 320 - (log10(mem) / log10(131)) * 320 -->
    <!-- 8MB: log10=0.90 → y=320 - (0.90/2.12)*320 = 184 -->
    <!-- 18MB: log10=1.26 → y=320 - (1.26/2.12)*320 = 130 -->
    <!-- 32MB: log10=1.51 → y=320 - (1.51/2.12)*320 = 92 -->
    <!-- 68MB: log10=1.83 → y=320 - (1.83/2.12)*320 = 44 -->
    <!-- 131MB: log10=2.12 → y=320 - (2.12/2.12)*320 = 0 -->

    <!-- Time Line (log scale on both axes) -->
    <path d="M 0 227 L 263 135 L 376 96 L 527 44 L 640 0" class="line-time"/>

    <!-- Time Dots -->
    <circle cx="0" cy="227" class="dot dot-time"/>
    <circle cx="263" cy="135" class="dot dot-time"/>
    <circle cx="376" cy="96" class="dot dot-time"/>
    <circle cx="527" cy="44" class="dot dot-time"/>
    <circle cx="640" cy="0" class="dot dot-time"/>

    <!-- Memory Line (log scale on both axes) -->
    <path d="M 0 184 L 263 130 L 376 92 L 527 44 L 640 0" class="line-memory"/>

    <!-- Memory Dots -->
    <circle cx="0" cy="184" class="dot dot-memory"/>
    <circle cx="263" cy="130" class="dot dot-memory"/>
    <circle cx="376" cy="92" class="dot dot-memory"/>
    <circle cx="527" cy="44" class="dot dot-memory"/>
    <circle cx="640" cy="0" class="dot dot-memory"/>

    <!-- Regression Lines (dashed) - Linear in log-log space -->
    <!-- Time: log10(time) = 0.0041*files + 0.7... actually the formula says linear in linear space -->
    <!-- For display, draw from first to last point -->
    <path d="M 0 227 L 640 0" class="regression" stroke="#3b82f6"/>
    <path d="M 0 184 L 640 0" class="regression" stroke="#16a34a"/>

    <!-- X Axis Labels -->
    <g font-size="11" fill="#334155" text-anchor="middle">
      <text x="0" y="345">1,000</text>
      <text x="263" y="345">5,000</text>
      <text x="376" y="345">10,000</text>
      <text x="527" y="345">25,000</text>
      <text x="640" y="345">50,000</text>
    </g>
    <text x="320" y="370" class="axis-label" text-anchor="middle">File Count (log scale)</text>

    <!-- Data Value Labels -->
    <g font-size="9" font-weight="500" text-anchor="middle">
      <text x="0" y="223" fill="#3b82f6">4.8 ms</text>
      <text x="0" y="180" fill="#16a34a">8 MB</text>
      <text x="263" y="131" fill="#3b82f6">22.6 ms</text>
      <text x="263" y="126" fill="#16a34a">18 MB</text>
      <text x="376" y="92" fill="#3b82f6">42.8 ms</text>
      <text x="376" y="88" fill="#16a34a">32 MB</text>
      <text x="527" y="40" fill="#3b82f6">102 ms</text>
      <text x="527" y="40" fill="#16a34a" dy="14">68 MB</text>
      <text x="640" y="-4" fill="#3b82f6">212 ms</text>
      <text x="640" y="-4" fill="#16a34a" dy="14">131 MB</text>
    </g>
  </g>

  <!-- Legend -->
  <rect x="520" y="50" width="260" height="110" class="legend-box"/>
  <line x1="530" y1="65" x2="550" y2="65" class="line-time" stroke-width="3"/>
  <text x="555" y="69" class="legend-item">Scan Time (ms) — measured</text>
  <line x1="530" y1="85" x2="550" y2="85" class="line-memory" stroke-width="3"/>
  <text x="555" y="89" class="legend-item">Peak RSS (MB) — measured</text>
  <path d="M 530 105 L 550 105" class="regression" stroke="#3b82f6"/>
  <text x="555" y="109" class="legend-item" fill="#ef4444">Time: y = 0.0041x + 0.7 (R²=0.998)</text>
  <path d="M 530 125 L 550 125" class="regression" stroke="#16a34a"/>
  <text x="555" y="129" class="legend-item" fill="#ef4444">Memory: y = 0.0025x + 5.8 (R²=0.992)</text>

  <!-- Caption -->
  <text x="400" y="400" class="caption" text-anchor="middle">Scan time scales linearly with file count (R² = 0.998). Memory scales sub-linearly due to streaming extraction (R² = 0.992). Both axes log-scaled for clarity.</text>
</svg>