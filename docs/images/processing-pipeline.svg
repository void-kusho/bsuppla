<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .stage-box { fill: #f8fafc; stroke: #3b82f6; stroke-width: 2; rx: 8; }
      .stage-box:hover { fill: #eff6ff; }
      .stage-title { font: 600 13px 'Segoe UI', system-ui, sans-serif; fill: #1e40af; }
      .stage-desc { font: 400 10px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
      .stage-code { font: 400 9px 'JetBrains Mono', 'Fira Code', monospace; fill: #64748b; }
      .arrow { fill: none; stroke: #3b82f6; stroke-width: 2; marker-end: url(#arrowhead); }
      .optional { fill: #fef3c7; stroke: #f59e0b; }
      .optional .stage-title { fill: #92400e; }
      .input-box { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; rx: 8; }
      .output-box { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; rx: 8; }
      .process-box { fill: #f3e8ff; stroke: #a855f7; stroke-width: 2; rx: 8; }
      .side-note { font: 400 9px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .flow-label { font: 400 9px 'Segoe UI', system-ui, sans-serif; fill: #3b82f6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="25" font="600 16px 'Segoe UI', system-ui, sans-serif" fill="#1e293b" text-anchor="middle">Analysis Pipeline: 6 Stages</text>

  <!-- Stage 0: Acquisition (Optional) -->
  <rect x="330" y="40" width="300" height="70" class="stage-box optional"/>
  <text x="480" y="63" class="stage-title" text-anchor="middle">Stage 0: Acquisition (Optional)</text>
  <text x="480" y="81" class="stage-desc" text-anchor="middle">docker pull + docker save → image.tar</text>
  <text x="480" y="97" class="stage-code" text-anchor="middle">pipeline.rs → ingest/docker.rs  |  BSUPPLA_SKIP_DOCKER=1 to skip</text>

  <!-- Arrow down -->
  <path d="M480 110 L480 125" class="arrow"/>

  <!-- Stage 1: Image Loading -->
  <rect x="310" y="125" width="340" height="75" class="stage-box"/>
  <text x="480" y="148" class="stage-title" text-anchor="middle">Stage 1: Image Loading</text>
  <text x="480" y="166" class="stage-desc" text-anchor="middle">Parse image.tar → extract manifest.json</text>
  <text x="480" y="182" class="stage-code" text-anchor="middle">ingest/image.rs  →  ingest/manifest.rs</text>

  <!-- Arrow down -->
  <path d="M480 200 L480 215" class="arrow"/>

  <!-- Stage 2: Layer Verification -->
  <rect x="310" y="215" width="340" height="75" class="stage-box"/>
  <text x="480" y="238" class="stage-title" text-anchor="middle">Stage 2: Layer Verification</text>
  <text x="480" y="256" class="stage-desc" text-anchor="middle">Verify all referenced layers exist in tar</text>
  <text x="480" y="272" class="stage-code" text-anchor="middle">ingest/layers.rs → locate_layers()</text>

  <!-- Arrow down -->
  <path d="M480 290 L480 305" class="arrow"/>

  <!-- Stage 3: Filesystem Reconstruction -->
  <rect x="310" y="305" width="340" height="75" class="stage-box"/>
  <text x="480" y="328" class="stage-title" text-anchor="middle">Stage 3: Filesystem Reconstruction</text>
  <text x="480" y="346" class="stage-desc" text-anchor="middle">Extract layer.tar.gz in order (override semantics)</text>
  <text x="480" y="362" class="stage-code" text-anchor="middle">ingest/extract.rs → build_filesystem()</text>

  <!-- Arrow down -->
  <path d="M480 380 L480 395" class="arrow"/>

  <!-- Stage 4: Directory Traversal + Detection -->
  <rect x="180" y="395" width="600" height="95" class="stage-box process-box"/>
  <text x="480" y="418" class="stage-title" text-anchor="middle">Stage 4: Directory Traversal & Detection</text>
  <text x="480" y="438" class="stage-desc" text-anchor="middle">Walk filesystem → build FileContext per file → query DetectorRegistry</text>
  <text x="480" y="456" class="stage-code" text-anchor="middle">scan/scanner.rs → walk_dir()  |  detectors/default_registry() built once</text>
  <text x="480" y="472" class="stage-code" text-anchor="middle">FileContext: path, mode, is_executable, is_world_writable, is_suid, is_sgid, normalized_path()</text>

  <!-- Arrow down -->
  <path d="M480 490 L480 505" class="arrow"/>

  <!-- Stage 5: Report Generation -->
  <rect x="310" y="505" width="340" height="65" class="stage-box output-box"/>
  <text x="480" y="526" class="stage-title" text-anchor="middle">Stage 5: Report Generation</text>
  <text x="480" y="542" class="stage-desc" text-anchor="middle">Allowlist filter → Baseline diff → Severity scoring → Suspicion level</text>
  <text x="480" y="558" class="stage-code" text-anchor="middle">scan/report.rs → report_findings()</text>

  <!-- Side annotations: Input (left) -->
  <text x="100" y="80" font="500 10px 'Segoe UI', system-ui, sans-serif" fill="#ef4444" text-anchor="middle">Input</text>
  <text x="100" y="95" class="side-note" text-anchor="middle">Docker Image (.tar)</text>
  <text x="100" y="110" class="side-note" text-anchor="middle">Untrusted — never executed</text>

  <!-- Side annotations: Output (right) -->
  <text x="860" y="530" font="500 10px 'Segoe UI', system-ui, sans-serif" fill="#22c55e" text-anchor="middle">Output</text>
  <text x="860" y="545" class="side-note" text-anchor="middle">Findings + Suspicion</text>
  <text x="860" y="560" class="side-note" text-anchor="middle">Trusted — verified code</text>

  <!-- Data flow labels on arrows (left side) -->
  <text x="500" y="85" class="flow-label">image.tar</text>
  <text x="500" y="165" class="flow-label">manifest.json</text>
  <text x="500" y="270" class="flow-label">layer paths</text>
  <text x="500" y="365" class="flow-label">extracted filesystem</text>
  <text x="500" y="470" class="flow-label" fill="#a855f7">FileContext × N files</text>
  <text x="500" y="555" class="flow-label" fill="#22c55e">Findings[]</text>
</svg>